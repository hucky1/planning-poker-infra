name: planning-poker

services:
  backend:
    image: "${BACKEND_IMAGE}"
    restart: unless-stopped
    environment:
      APP_ENV: "${APP_ENV:-prod}"
      APP_DEBUG: "${APP_DEBUG:-0}"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "${REDIS_URL}"
    expose:
      - "${BACKEND_INTERNAL_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${BACKEND_INTERNAL_PORT:-8080}${BACKEND_HEALTHCHECK_PATH:-/} || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: "${FRONTEND_IMAGE}"
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
    depends_on:
      backend:
        condition: service_healthy
