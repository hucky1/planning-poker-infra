name: planning-poker

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        PHP_VERSION: "${PHP_VERSION:-8.5-fpm-alpine}"
        COMPOSER_VERSION: "${COMPOSER_VERSION:-2}"
        INSTALL_XDEBUG: "${INSTALL_XDEBUG:-0}"
    working_dir: /workspace
    restart: unless-stopped
    volumes:
      - ./planning-poker-backend:/workspace
      - ./docker/backend/xdebug.ini:/usr/local/etc/php/conf.d/99-xdebug.ini:ro
    expose:
      - "9000"
    environment:
      APP_ENV: "${APP_ENV:-dev}"
      APP_DEBUG: "${APP_DEBUG:-1}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-0}"
      COMPOSER_ALLOW_SUPERUSER: "1"
      DATABASE_URL: "${DATABASE_URL:-postgresql://app:app@db:5432/planning_poker?serverVersion=17&charset=utf8}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
      XDEBUG_START_WITH_REQUEST: "${XDEBUG_START_WITH_REQUEST:-trigger}"
      XDEBUG_CLIENT_HOST: "${XDEBUG_CLIENT_HOST:-host.docker.internal}"
      XDEBUG_CLIENT_PORT: "${XDEBUG_CLIENT_PORT:-9003}"
      XDEBUG_DISCOVER_CLIENT_HOST: "${XDEBUG_DISCOVER_CLIENT_HOST:-0}"
      XDEBUG_IDEKEY: "${XDEBUG_IDEKEY:-VSCODE}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend-web:
    image: "${NGINX_IMAGE:-nginx:1.27-alpine}"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./planning-poker-backend:/workspace
      - ./docker/backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${BACKEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "pidof nginx >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        NODE_VERSION: "${NODE_VERSION:-20-alpine}"
    working_dir: /workspace
    restart: unless-stopped
    volumes:
      - ./planning-poker-frontend:/workspace
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      FRONTEND_PORT: "5173"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8080}"
    depends_on:
      backend-web:
        condition: service_healthy

  db:
    image: "${POSTGRES_IMAGE:-postgres:17-alpine}"
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-planning_poker}"
      POSTGRES_USER: "${POSTGRES_USER:-app}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-app}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-planning_poker}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: "${REDIS_IMAGE:-redis:7-alpine}"
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_data:
  redis_data:
